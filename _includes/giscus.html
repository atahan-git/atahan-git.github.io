{% if site.giscus.repo and site.giscus.repo_id and site.giscus.category and site.giscus.category_id %}
<div class="comments">
  <script src="https://giscus.app/client.js"
    data-repo="{{ site.giscus.repo | escape }}"
    data-repo-id="{{ site.giscus.repo_id | escape }}"
    data-category="{{ site.giscus.category | escape }}"
    data-category-id="{{ site.giscus.category_id | escape }}"
    data-mapping="pathname"
    data-strict="0"
    data-reactions-enabled="1"
    data-emit-metadata="0"
    data-input-position="top"
    data-theme="light"
    data-lang="en"
    crossorigin="anonymous"
    async>
  </script>
</div>
{% endif %}
